<div class="container mt-3">
  <div class="d-flex flex-wrap gap-2" role="group" aria-label="Ticket Actions">
    <a href="/ticket/{{ ticket_id }}" class="btn btn-outline-primary">View Ticket</a> 
    <a href="/ticket/{{ ticket_id }}/history" class="btn btn-outline-secondary">History</a> 
    <a href="/ticket/{{ ticket_id }}/sla" class="btn btn-outline-info">SLA</a> 

    <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#commentModal">Add Comment</button> 
    
    <button type="button" class="btn btn-outline-primary" onclick="showAssignDialog()">Assign</button> 
    <button type="button" class="btn btn-outline-warning" onclick="acknowledgeTicket()">Acknowledge</button> 
    <button type="button" class="btn btn-outline-success" onclick="resolveTicket()">Resolve</button> 
    <button type="button" class="btn btn-outline-dark" onclick="closeTicket()">Close</button> 
  </div>
</div>
