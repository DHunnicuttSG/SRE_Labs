<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ticket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
{% include 'navbar.html' %}
<div class="container mt-4">

<h1>Create Ticket</h1>

<form id="ticketForm">

<input
class="form-control mb-3"
placeholder="Title"
id="title">

<textarea
class="form-control mb-3"
placeholder="Description"
id="description"></textarea>

<select
class="form-select mb-3"
id="severity">

<option>SEV1</option>
<option>SEV2</option>
<option>SEV3</option>
<option>SEV4</option>

</select>

<button
class="btn btn-primary">

Submit

</button>

</form>

<script>

document
 .getElementById("ticketForm")
 .addEventListener(
   "submit",
   async function(e) {

    e.preventDefault();

    await fetch(
      "/tickets",
      {
        method:"POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          title:
            document
            .getElementById("title")
            .value,

          description:
            document
            .getElementById("description")
            .value,

          severity:
            document
            .getElementById("severity")
            .value,

          priority:"HIGH"
        })
      });

      window.location = "/";
 });

</script>

</div>
</body>
</html>
