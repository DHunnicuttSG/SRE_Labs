<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ticket History</title>
    <!-- Fixed Bootstrap CSS Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% include 'navbar.html' %}
<div class="container mt-4">
    <!-- Fixed Back Link Tag -->
    <div class="mb-3">
        <a href="/" class="btn btn-outline-secondary">← Back to Dashboard</a>
    </div>

    <h1>Ticket History</h1>

    <h3 class="mt-4">Comments</h3>
    <div id="comments"></div>

    <hr>

    <h3>Status History</h3>
    <div id="statusHistory"></div>

    <hr>

    <h3>Assignment History</h3>
    <div id="assignmentHistory"></div>
</div>

<script>
const ticketId = {{ ticket_id }};

async function loadComments() {
    const response = await fetch(`/tickets/${ticketId}/comments`);
    const rows = await response.json();
    let html = "";

    rows.forEach(row => {
        html += `
        <div class="card mb-2">
            <div class="card-body">
                <b>${row.author}</b>
                <p class="mb-0">${row.comment}</p>
            </div>
        </div>
        `;
    });

    document.getElementById("comments").innerHTML = html;
}

async function loadStatusHistory() {
    const response = await fetch(`/tickets/${ticketId}/status-history`);
    const rows = await response.json();
    let html = "<ul class='list-group'>";

    rows.forEach(row => {
        html += `
        <li class="list-group-item">
            <span class="text-muted">${row.old_status}</span> 
            <span class="mx-2">→</span> 
            <strong>${row.new_status}</strong>
        </li>
        `;
    });

    html += "</ul>";
    document.getElementById("statusHistory").innerHTML = html;
}

async function loadAssignments() {
    const response = await fetch(`/tickets/${ticketId}/assignments`);
    const rows = await response.json();
    let html = "<ul class='list-group'>";

    rows.forEach(row => {
        html += `
        <li class="list-group-item">
            <span class="text-muted">${row.old_owner || 'Unassigned'}</span> 
            <span class="mx-2">→</span> 
            <strong>${row.new_owner}</strong>
        </li>
        `;
    });

    html += "</ul>";
    document.getElementById("assignmentHistory").innerHTML = html;
}

loadComments();
loadStatusHistory();
loadAssignments();
</script>

</body>
</html>
