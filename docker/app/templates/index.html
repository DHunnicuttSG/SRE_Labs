<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRE Labs Incident Portal</title>
    <!-- Fixed: Closed the Bootstrap link tag properly -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% include 'navbar.html' %}
    <div class="container mt-4">
        <div class="row">
            <div class="col">
                <h1 class="mb-4">SRE Labs Incident Portal</h1>
                <!-- Fixed: Added opening <a> tag for the button -->
                <a href="/create-ticket" class="btn btn-primary mb-3">Create Ticket</a>
                
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Severity</th>
                            <th>Status</th>
                            <th>Owner</th>
                        </tr>
                    </thead>
                    <tbody id="ticketsTable">
                        <!-- Tickets will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- Fixed: Corrected the script tag syntax and file path -->
    <script src="/static/js/tickets.js"></script>
</body>
</html>
