<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Incidents</title>
    <!-- Fixed Bootstrap Link Syntax -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% include 'navbar.html' %}
<div class="container mt-4">
    <h1>Open Incidents</h1>

    <!-- Fixed Broken Navigation Link Tags -->
    <div class="mb-3 d-flex gap-2">
        <a href="/" class="btn btn-outline-secondary">Home</a>
        <a href="/dashboard" class="btn btn-outline-secondary">Dashboard</a>
        <a href="/create-ticket" class="btn btn-primary">Create Ticket</a>
    </div>

    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Severity</th>
                <th>Status</th>
                <th>Owner</th>
            </tr>
        </thead>
        <tbody id="ticketsTable">
            <!-- Dynamic data will load here -->
        </tbody>
    </table>
</div>

<script>
async function loadOpenIncidents() {
    const response = await fetch("/tickets");
    const tickets = await response.json();

    const openTickets = tickets.filter(
        ticket => ticket.status !== "CLOSED"
    );

    let html = "";

    openTickets.forEach(ticket => {
        let severityBadge = "bg-success";
        if (ticket.severity === "SEV1") severityBadge = "bg-danger";
        else if (ticket.severity === "SEV2") severityBadge = "bg-warning text-dark";
        else if (ticket.severity === "SEV3") severityBadge = "bg-info text-dark";

        let statusBadge = "bg-secondary";
        if (ticket.status === "OPEN") statusBadge = "bg-warning text-dark";
        else if (ticket.status === "IN_PROGRESS") statusBadge = "bg-primary";
        else if (ticket.status === "RESOLVED") statusBadge = "bg-success";

        html += `
        <tr>
            <td>${ticket.id}</td>
            <td>
                <a href="/ticket/${ticket.id}">${ticket.title}</a>
            </td>
            <td>
                <span class="badge ${severityBadge}">${ticket.severity}</span>
            </td>
            <td>
                <span class="badge ${statusBadge}">${ticket.status}</span>
            </td>
            <td>${ticket.owner || 'Unassigned'}</td>
        </tr>
        `;
    });

    document.getElementById("ticketsTable").innerHTML = html;
}

loadOpenIncidents();
</script>

</body>
</html>
