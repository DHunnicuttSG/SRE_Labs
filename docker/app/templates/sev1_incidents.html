<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEV1 Incidents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <!-- Fixed Header Tag -->
    <h1>SEV1 Incidents</h1>

    <!-- Fixed Navigation Links -->
    <div class="mb-3 d-flex gap-2">
        <a href="/" class="btn btn-outline-secondary">Ticket List</a>
        <a href="/dashboard" class="btn btn-outline-secondary">Dashboard</a>
        <a href="/open-incidents" class="btn btn-outline-secondary">Open Incidents</a>
        <a href="/create-ticket" class="btn btn-primary">Create Ticket</a>
    </div>

    <div class="alert alert-danger">
        <strong>Critical Incident View</strong>
        <br>
        Displays all active SEV1 incidents.
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Status</th>
                <th>Owner</th>
                <th>Priority</th>
                <th>Severity</th>
            </tr>
        </thead>
        <tbody id="ticketsTable">
            <!-- Dynamic data will load here -->
        </tbody>
    </table>

</div>

<script>
async function loadSev1Incidents() {
    const response = await fetch("/tickets");
    const tickets = await response.json();

    const sev1Tickets = tickets.filter(ticket =>
        ticket.severity === "SEV1"
    );

    let html = "";

    sev1Tickets.forEach(ticket => {
        let statusBadge = "bg-secondary";

        if (ticket.status === "OPEN") statusBadge = "bg-warning text-dark";
        if (ticket.status === "IN_PROGRESS") statusBadge = "bg-primary";
        if (ticket.status === "RESOLVED") statusBadge = "bg-success";
        if (ticket.status === "CLOSED") statusBadge = "bg-secondary";

        html += `
            <tr>
                <td>${ticket.id}</td>
                <td>
                    <a href="/ticket/${ticket.id}">${ticket.title}</a>
                </td>
                <td>
                    <span class="badge ${statusBadge}">${ticket.status}</span>
                </td>
                <td>${ticket.owner || 'Unassigned'}</td>
                <td>${ticket.priority || 'N/A'}</td>
                <td>
                    <span class="badge bg-danger">${ticket.severity}</span>
                </td>
            </tr>
        `;
    });

    document.getElementById("ticketsTable").innerHTML = html;
}

loadSev1Incidents();
</script>

</body>
</html>
