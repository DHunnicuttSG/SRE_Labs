<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SLA Information</title>
    <!-- Fixed Bootstrap CSS Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <!-- Fixed Back Link Tag -->
    <div class="mb-3">
        <a href="/" class="btn btn-outline-secondary">← Back to Dashboard</a>
    </div>

    <h1>SLA Information</h1>

    <div id="sla"></div>
</div>

<script>
const ticketId = {{ ticket_id }};

async function loadSLA() {
    const response = await fetch(`/tickets/${ticketId}/sla`);
    const sla = await response.json();

    // Added a conditional badge color for the Breach status
    const breachBadge = sla.breached 
        ? '<span class="badge bg-danger">True</span>' 
        : '<span class="badge bg-success">False</span>';

    document.getElementById("sla").innerHTML = `
        <div class="card" style="max-width: 400px;">
            <div class="card-body">
                <h5 class="card-title">Severity: ${sla.severity}</h5>
                <p class="card-text">Target: <strong>${sla.target_minutes} minutes</strong></p>
                <p class="card-text mb-0">Breached: ${breachBadge}</p>
            </div>
        </div>
    `;
}

loadSLA();
</script>

</body>
</html>
