<!DOCTYPE html>
<html>

<head>

https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css

</head>

<body class="container mt-4">

<h1>Ticket Details</h1>

<div id="ticketDetails"></div>

<h3>Comments</h3>

<div id="comments"></div>

<script>

const ticketId =
{{ ticket_id }};

async function loadTicket() {

    const response =
        await fetch(`/tickets/${ticketId}`);

    const ticket =
        await response.json();

    document
       .getElementById("ticketDetails")
       .innerHTML = `
       <div class="card">

         <div class="card-body">

          <h5>${ticket.title}</h5>

          <p>${ticket.description}</p>

          <p>Status:
             ${ticket.status}</p>

          <p>Severity:
             ${ticket.severity}</p>

         </div>

       </div>
       `;
}

async function loadComments() {

    const response =
        await fetch(
            `/tickets/${ticketId}/comments`
        );

    const comments =
        await response.json();

    let html = "";

    comments.forEach(comment => {

        html += `
        <div class="card mb-2">

            <div class="card-body">

                <b>${comment.author}</b>

                <p>${comment.comment}</p>

            </div>

        </div>
        `;
    });

    document
      .getElementById("comments")
      .innerHTML = html;
}

loadTicket();
loadComments();

</script>

</body>
</html>
