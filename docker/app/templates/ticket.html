<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
{% include 'navbar.html' %}
<div class="container mt-4">

    <h1>Ticket Details</h1>
    <div id="ticketDetails" class="mb-4"></div>

    <h3>Comments</h3>
    <div id="comments"></div>

    <script>
    // Fixed: Wrapped the template variable in quotes so it handles strings safely
    const ticketId = "{{ ticket_id }}";

    // Helper function to safely escape HTML strings to prevent XSS attacks
    function escapeHTML(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    async function loadTicket() {
        try {
            const response = await fetch(`/tickets/${ticketId}`);
            if (!response.ok) throw new Error('Failed to fetch ticket');
            const ticket = await response.json();

            // Fixed: Sanitized inputs using escapeHTML
            document.getElementById("ticketDetails").innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <h5>${escapeHTML(ticket.title)}</h5>
                        <p>${escapeHTML(ticket.description)}</p>
                        <p><strong>Status:</strong> ${escapeHTML(ticket.status)}</p>
                        <p><strong>Severity:</strong> ${escapeHTML(ticket.severity)}</p>
                        <p><strong>Priority:</strong> ${escapeHTML(ticket.priority)}</p>
                    </div>
                </div>
            `;
        } catch (error) {
            document.getElementById("ticketDetails").innerHTML = `<div class="alert alert-danger">Error loading ticket details.</div>`;
        }
    }

    async function loadComments() {
        try {
            const response = await fetch(`/tickets/${ticketId}/comments`);
            if (!response.ok) throw new Error('Failed to fetch comments');
            const comments = await response.json();

            let html = "";
            comments.forEach(comment => {
                // Fixed: Sanitized inputs using escapeHTML
                html += `
                    <div class="card mb-2">
                        <div class="card-body">
                            <strong>${escapeHTML(comment.author)}</strong>
                            <p class="mb-0">${escapeHTML(comment.comment)}</p>
                        </div>
                    </div>
                `;
            });

            document.getElementById("comments").innerHTML = html || "<p class='text-muted'>No comments yet.</p>";
        } catch (error) {
            document.getElementById("comments").innerHTML = `<div class="alert alert-danger">Error loading comments.</div>`;
        }
    }

    // Initialize data fetch
    loadTicket();
    loadComments();
    </script>

</div>
</body>
</html>
